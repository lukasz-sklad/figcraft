types {
    text/html                             html htm shtml;
    text/css                              css;
    application/javascript                js mjs;
    application/wasm                      wasm;
    image/svg+xml                         svg svgz;
    image/png                             png;
    image/jpeg                            jpeg jpg;
    application/json                      json;
    font/otf                              otf;
    font/ttf                              ttf;
    font/woff                             woff;
    font/woff2                            woff2;
}

server {
    listen 8080 default_server;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Wymuszenie trailing slash dla /figcraft -> /figcraft/
    location = /figcraft {
        return 301 /figcraft/;
    }

    # Obsługa zapytań pod ścieżką /figcraft/
    location /figcraft/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Obsługa zapytań pod ścieżką /fig/
    location = /fig {
        return 301 /fig/;
    }
    location /fig/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Obsługa zapytań pod ścieżką /figma/
    location = /figma {
        return 301 /figma/;
    }
    location /figma/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Obsługa bezpośredniej ścieżki /
    location / {
        try_files $uri $uri/ /index.html;
    }
}
